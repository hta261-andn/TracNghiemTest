<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GD3 Auth Smoke Test</title>
<style>body{font-family:system-ui,Arial;margin:20px;max-width:980px}input,select,button,textarea{font:inherit;padding:9px;margin:4px 0}input{width:min(460px,95%)}button{cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{border:1px solid #ddd;border-radius:10px;padding:14px;margin:12px 0}.ok{color:#087a2f}.bad{color:#b00020}pre{white-space:pre-wrap;word-break:break-word;background:#f6f7f8;padding:10px;border-radius:8px}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head>
<body>
<h1>GĐ3 Authentication Smoke Test</h1>
<p>Origin: <b id="origin"></b></p>
<div class="card"><label>Web App /exec</label><br><input id="url" value="https://script.google.com/macros/s/AKfycby9nG75xkqsUjbGkUc64urrLtmE4kQedN9RkZgZ1qCUAaIT6_cM2nScHLyKoH8-x4je/exec"></div>
<div class="row">
<div class="card"><h3>Public / portal</h3><button onclick="health()">1. healthCheck</button><br>
<input id="uq" value="AREA_001"><button onclick="suggest('unit')">2. suggestUnitUsers</button><br>
<input id="aq" value="Admin"><button onclick="suggest('admin')">3. suggestAdminUsers</button><br>
<button onclick="wrongPortal()">4. Admin → unit phải WRONG_PORTAL</button></div>
<div class="card"><h3>Unit</h3><input id="unitLogin" placeholder="login_input unit, ví dụ AREA_001_01"><br><input id="unitPass" type="password" placeholder="Mật khẩu unit hiện tại"><br><button onclick="login('unit')">5. loginUnit</button><hr><strong>Đổi mật khẩu lần đầu</strong><br><input id="unitNewPass" type="password" placeholder="Mật khẩu mới (>=8 ký tự, hoa, thường, số, ký tự đặc biệt)"><br><button onclick="firstLoginChangePassword('unit')">5A. firstLoginChangePassword</button> <button onclick="profile('unit')">5B. getMyProfile</button></div>
</div>
<div class="row">
<div class="card"><h3>Admin/Superadmin</h3>
<input id="adminLogin" value="Admin" placeholder="Admin hoặc admin được cấp"><br>
<input id="adminPass" type="password" placeholder="Mật khẩu quản trị hiện tại"><br>
<button onclick="login('admin')">6. loginAdmin</button> <button onclick="profile('admin')">6B. getMyProfile</button>
<hr><strong>Đổi mật khẩu lần đầu Admin/Superadmin</strong><br>
<input id="adminNewPass" type="password" placeholder="Mật khẩu mới (>=8 ký tự, hoa, thường, số, ký tự đặc biệt)"><br>
<button onclick="firstLoginChangePassword('admin')">6A. firstLoginChangePassword</button>
</div>
<div class="card"><h3>Confirm token</h3><select id="who"><option value="admin">admin token</option><option value="unit">unit token</option></select><br><input id="confirmPass" type="password" placeholder="Nhập lại mật khẩu"><br><input id="scope" value="TEST_SCOPE"><br><button onclick="verifySensitive()">7. verifyPasswordForSensitiveAction</button> <button onclick="consume()">8. consumeConfirmToken</button></div>
</div>
<div class="card"><h3>Kết quả</h3><pre id="out">Chưa chạy.</pre></div>
<script>
const state={unitToken:'',adminToken:'',confirmToken:'',confirmScope:''};
document.getElementById('origin').textContent=location.origin;
function rid(){return 'REQ_GD3_'+Date.now()+'_'+Math.random().toString(36).slice(2)}
function safe(x){if(!x||typeof x!=='object')return x;let y=Array.isArray(x)?[]:{};for(const k in x){if(['token','confirm_token','password','password_hash','salt','token_hash','confirm_token_hash'].includes(k.toLowerCase()))y[k]='[HIDDEN]';else y[k]=safe(x[k])}return y}
function show(label,obj){document.getElementById('out').textContent=label+'\n'+JSON.stringify(safe(obj),null,2)}
async function api(action,{token='',portal='',payload={}}={}){const r=await fetch(document.getElementById('url').value,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,request_id:rid(),token,portal,payload,client_info:{source:'GD3_SMOKE',portal,user_agent:navigator.userAgent}})});return await r.json()}
async function health(){show('healthCheck',await api('healthCheck'))}
async function suggest(kind){const action=kind==='unit'?'suggestUnitUsers':'suggestAdminUsers';const q=document.getElementById(kind==='unit'?'uq':'aq').value;show(action,await api(action,{portal:kind==='unit'?'unit_portal':'admin_portal',payload:{query:q}}))}
async function wrongPortal(){show('Admin → unit expected WRONG_PORTAL',await api('loginUnit',{portal:'unit_portal',payload:{login_input:'Admin',password:'not-used-for-wrong-portal'}}))}
async function login(kind){const admin=kind==='admin', portal=admin?'admin_portal':'unit_portal', action=admin?'loginAdmin':'loginUnit';const login_input=document.getElementById(admin?'adminLogin':'unitLogin').value,password=document.getElementById(admin?'adminPass':'unitPass').value;const res=await api(action,{portal,payload:{login_input,password,portal}});if(res.ok&&res.data&&res.data.token)state[kind+'Token']=res.data.token;show(action,res)}
async function firstLoginChangePassword(kind){
 const admin=kind==='admin';
 const token=state[kind+'Token'];
 const current_password=document.getElementById(admin?'adminPass':'unitPass').value;
 const new_password=document.getElementById(admin?'adminNewPass':'unitNewPass').value;
 const portal=admin?'admin_portal':'unit_portal';
 if(!token){show(kind+' firstLoginChangePassword',{ok:false,message:'Chưa có '+kind+' token. Hãy đăng nhập thành công trước.'});return}
 const res=await api('firstLoginChangePassword',{token,portal,payload:{current_password,new_password}});
 show(kind+' firstLoginChangePassword',res)
}
async function profile(kind){const token=state[kind+'Token'];show(kind+' getMyProfile',await api('getMyProfile',{token,portal:kind==='admin'?'admin_portal':'unit_portal',payload:{}}))}
async function verifySensitive(){const kind=document.getElementById('who').value, token=state[kind+'Token'], portal=kind==='admin'?'admin_portal':'unit_portal', password=document.getElementById('confirmPass').value, scope=document.getElementById('scope').value;const res=await api('verifyPasswordForSensitiveAction',{token,portal,payload:{password,scope}});if(res.ok&&res.data){state.confirmToken=res.data.confirm_token||'';state.confirmScope=res.data.confirm_scope||scope}show('verifyPasswordForSensitiveAction',res)}
async function consume(){const kind=document.getElementById('who').value, token=state[kind+'Token'], portal=kind==='admin'?'admin_portal':'unit_portal';show('consumeConfirmToken',await api('consumeConfirmToken',{token,portal,payload:{confirm_token:state.confirmToken,scope:state.confirmScope}}))}
</script></body></html>
